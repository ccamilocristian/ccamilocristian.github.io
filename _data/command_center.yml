    - title: "Scheduled email delivery"
      summary: "Send generated files with modern Gmail authentication and run the job on a schedule."
      url: "/posts/automation-sending/"
      label: "Automate the email →"

recent_notes:
  title: "Latest from the blog"
  limit: 3

