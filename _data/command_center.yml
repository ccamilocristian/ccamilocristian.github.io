# Command Center — home content model
# status: live = wired to real repo data · mock = placeholder to fill later

hero:
  eyebrow: "Data Scientist · AI & Computer Vision · Data Engineering · BI & Analytics"
  name: "Cristian Camilo Moreno Narváez"
  brand_note: "CCMN"
  avatar: "/assets/img/profile/portrait.png"
  title: "My profile, portfolio, and blog—in one place."
  lead: >
    Economist by training, data scientist in practice—7+ years building pipelines, models, and BI
    in banking, SaaS, and AI programs. This site is my profile, a portfolio of real work, and a
    blog where I think out loud about data, ML, and economics.
  actions:
    - label: "Review profile"
      url: "/tabs/profile/"
      style: primary
    - label: "Read the blog"
      url: "/tabs/intelligence/"
      style: glass

pulse:
  enabled: false
  eyebrow: "Live"
  title: "Site pulse"
  subtitle: "Counts pulled from this repository—not aspirational KPIs."

# "What you'll find here" — orientation guide so first-time visitors immediately
# understand the site and where to go next.
guide:
  enabled: true
  eyebrow: "Start here"
  title: "What you'll find here"
  subtitle: "Three ways in: who I am (profile), what I've built (portfolio), and how I think (blog)."
  items:
    - icon: "id-badge"
      accent: primary
      title: "Profile"
      summary: "Background, experience, and how I work—economist turned data scientist."
      label: "See profile →"
      url: "/tabs/profile/"
    - icon: "pen-nib"
      accent: secondary
      title: "Blog"
      summary: "Notes, build-alongs, and case studies on data, ML, BI, and economics (EN &amp; ES)."
      label: "Read the blog →"
      url: "/tabs/intelligence/"
    - icon: "envelope"
      accent: tertiary
      title: "Contact"
      summary: "Open to data, ML, and analytics roles or collaborations—reach out anytime."
      label: "Get in touch →"
      url: "mailto:cristianmorenonarvaez@outlook.com"

narrative:
  title: "Analysis → ML → BI → economics"
  body: >
    Most projects start by stabilizing messy inputs, then estimating with models you can inspect,
    then shipping interfaces people run week to week. When incentives or constraints shape the
    answer, I make that explicit before anyone treats a chart as policy.
  kicker: "Signal, model, decision"

selected_work:
  title: "Selected work"
  subtitle: "Problem · Process · Impact"
  action_label: "View all artifacts →"
  action_url: "/tabs/intelligence/"

