{% assign gtm = site.data.site_ops.gtm %}
{% if jekyll.environment == 'production' and gtm.enabled and gtm.container_id %}
<!-- Google Tag Manager — idle/async inject (consent defaults already set; avoids competing with LCP) -->
<script>
(function (w, d, s, l, i) {
  w[l] = w[l] || [];
  w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
  function inject() {
    if (d.getElementById('gtm-js')) return;
    var f = d.getElementsByTagName(s)[0],
      j = d.createElement(s),
      dl = l != 'dataLayer' ? '&l=' + l : '';
    j.async = true;
    j.id = 'gtm-js';
    j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
    f.parentNode.insertBefore(j, f);
  }
  if ('requestIdleCallback' in w) {
    requestIdleCallback(inject, { timeout: 2500 });
  } else if (d.readyState === 'complete') {
    inject();
  } else {
    w.addEventListener('load', inject);
  }
})(window, document, 'script', 'dataLayer', '{{ gtm.container_id }}');
</script>
<!-- End Google Tag Manager -->
{% endif %}
